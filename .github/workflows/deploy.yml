name: Deploy to GitHub Pages

# 每次推送到 main 都会重新构建并部署；也可在 Actions 页面手动触发。
# Pages 的构建源选择「GitHub Actions」时，本工作流即为部署管线。
on:
  push:
    branches: [main]
  workflow_dispatch:

# 部署到 Pages 所需的最小权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署，排队而不互相打断
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm run build = vue-tsc --noEmit && vite build，类型不通过就不会部署
      - name: Type check and build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
